<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fake Job Detector</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    textarea { width: 100%; height: 180px; padding: 10px; font-size: 15px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 20px; font-size: 15px; cursor: pointer; }
    #result { margin-top: 24px; padding: 16px; border-radius: 8px; display: none; }
    .low { background: #e6f4ea; }
    .medium { background: #fff4e0; }
    .high { background: #fde8e8; }
    .note { font-size: 13px; color: #666; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>Fake Job Detector</h1>
  <p>Paste a job post or recruiter message to see how likely it is to be a scam.</p>
  <textarea id="text" placeholder="Paste the message here..."></textarea>
  <br>
  <button id="check">Check</button>

  <div id="result">
    <h2 id="level"></h2>
    <p id="score"></p>
    <ul id="reasons"></ul>
  </div>

  <p class="note">This is a learning project. Its result is a warning sign, not proof.
  Never pay money to get a job.</p>

  <script>
    const button = document.getElementById("check");
    const box = document.getElementById("result");

    button.addEventListener("click", async () => {
      const text = document.getElementById("text").value;
      button.disabled = true;
      try {
        const response = await fetch("/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text }),
        });
        const data = await response.json();
        if (!response.ok) {
          alert(data.detail || "Something went wrong.");
          return;
        }
        box.className = data.level;
        box.style.display = "block";
        document.getElementById("level").textContent = "Risk: " + data.level.toUpperCase();
        document.getElementById("score").textContent = "Score: " + data.score + " / 100";
        const list = document.getElementById("reasons");
        list.innerHTML = "";
        const reasons = data.reasons.length ? data.reasons : ["No specific warning signs found."];
        for (const reason of reasons) {
          const item = document.createElement("li");
          item.textContent = reason;
          list.appendChild(item);
        }
      } catch (error) {
        alert("Could not reach the server.");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
